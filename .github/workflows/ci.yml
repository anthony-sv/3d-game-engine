name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  STRADA_DEPENDENCY_CACHE_DIR: ${{ github.workspace }}/.dependency-cache
  VULKAN_SDK_VERSION: 1.4.363.0
  # Hosted runners may have no display; windowed tests skip there instead of failing.
  STRADA_TESTS_ALLOW_NO_DISPLAY: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  format:
    name: Format check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install clang-format 22
        run: python -m pip install clang-format==22.1.3
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Check formatting
        run: python Tools/format.py --check

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Diag Windows Release player tests, SDK pinned to 10 (1)", os: windows-2025, config: release, allowNoGpu: "0",
              testSuites: "StradaRuntimeTests", pinSdk: "1" }
          - { name: "Diag Windows Release player tests, SDK pinned to 10 (2)", os: windows-2025, config: release, allowNoGpu: "0",
              testSuites: "StradaRuntimeTests", pinSdk: "1" }
          - { name: "Diag Windows Release player tests, SDK pinned to 10 (3)", os: windows-2025, config: release, allowNoGpu: "0",
              testSuites: "StradaRuntimeTests", pinSdk: "1" }
          - { name: "Diag Windows Release player tests, SDK pinned to 10 (4)", os: windows-2025, config: release, allowNoGpu: "0",
              testSuites: "StradaRuntimeTests", pinSdk: "1" }
          - { name: "Diag Windows Release player tests, SDK as found (1)", os: windows-2025, config: release, allowNoGpu: "0",
              testSuites: "StradaRuntimeTests", pinSdk: "0" }
          - { name: "Diag Windows Release player tests, SDK as found (2)", os: windows-2025, config: release, allowNoGpu: "0",
              testSuites: "StradaRuntimeTests", pinSdk: "0" }
          - { name: "Diag Windows Release player tests, SDK as found (3)", os: windows-2025, config: release, allowNoGpu: "0",
              testSuites: "StradaRuntimeTests", pinSdk: "0" }
          - { name: "Diag Windows Release player tests, SDK as found (4)", os: windows-2025, config: release, allowNoGpu: "0",
              testSuites: "StradaRuntimeTests", pinSdk: "0" }
    env:
      STRADA_TESTS_ALLOW_NO_GPU: ${{ matrix.allowNoGpu }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 -o DPkg::Lock::Timeout=300 update
          sudo apt-get -o Acquire::Retries=3 -o DPkg::Lock::Timeout=300 install -y --no-install-recommends \
            ninja-build pkg-config libwayland-dev libxkbcommon-dev xorg-dev libgtk-3-dev

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1.6.0
        with:
          vulkan_version: ${{ env.VULKAN_SDK_VERSION }}
          cache: true
          install_runtime: ${{ runner.os == 'Windows' }}
          install_lavapipe: ${{ runner.os != 'macOS' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache dependency archives
        uses: actions/cache@v6
        with:
          path: ${{ env.STRADA_DEPENDENCY_CACHE_DIR }}
          key: dependencies-${{ hashFiles('cmake/StradaDependencies.cmake') }}

      # Diagnostic only: without a global.json the newest installed SDK builds the C# projects.
      - name: Pin the .NET SDK to 10
        if: matrix.pinSdk == '1'
        shell: bash
        run: |
          printf '{
	"sdk": {
		"version": "10.0.100",
		"rollForward": "latestFeature",
		"allowPrerelease": false
	}
}
' > global.json
          cat global.json
          dotnet --version

      - name: Toolchain versions
        shell: bash
        run: |
          cmake --version
          ninja --version
          echo "VULKAN_SDK=${VULKAN_SDK}"
          if [ "$RUNNER_OS" = "macOS" ]; then xcodebuild -version; fi
          if [ "$RUNNER_OS" = "Linux" ]; then g++ --version; clang++ --version; fi
          dotnet --version

      # Building and testing are separate steps: a job killed by its time limit keeps its steps' times but no log, so the
      # step it was in tells which phase ran out of time. The test step runs the same command with --test in place of
      # --keep-going: its configure and build find everything up to date.
      # The build keeps going past a failed compile (--keep-going) and still fails the step: most contributors cannot
      # build two of the three platforms locally, and a run that stopped at the first error would cost one run per error.
      - name: Build
        shell: bash
        run: |
          compiler_args=()
          if [ -n "${{ matrix.compiler }}" ]; then compiler_args=(--compiler "${{ matrix.compiler }}"); fi
          precompile_args=()
          if [ -n "${{ matrix.precompileThirdPartyHeaders }}" ]; then
            precompile_args=("--cmake-arg=-DSTRADA_PRECOMPILE_THIRD_PARTY_HEADERS=${{ matrix.precompileThirdPartyHeaders }}")
          fi
          suite_args=()
          if [ -n "${{ matrix.testSuites }}" ]; then
            suite_args=("--cmake-arg=-DSTRADA_TEST_SUITES=${{ matrix.testSuites }}")
          fi
          python Tools/build.py --config "${{ matrix.config }}" "${compiler_args[@]}" "${precompile_args[@]}" "${suite_args[@]}" \
            --keep-going \
            "--cmake-arg=-DSTRADA_DEPENDENCY_CACHE_DIR=${STRADA_DEPENDENCY_CACHE_DIR}"

      - name: Test
        shell: bash
        run: |
          compiler_args=()
          if [ -n "${{ matrix.compiler }}" ]; then compiler_args=(--compiler "${{ matrix.compiler }}"); fi
          precompile_args=()
          if [ -n "${{ matrix.precompileThirdPartyHeaders }}" ]; then
            precompile_args=("--cmake-arg=-DSTRADA_PRECOMPILE_THIRD_PARTY_HEADERS=${{ matrix.precompileThirdPartyHeaders }}")
          fi
          suite_args=()
          if [ -n "${{ matrix.testSuites }}" ]; then
            suite_args=("--cmake-arg=-DSTRADA_TEST_SUITES=${{ matrix.testSuites }}")
          fi
          python Tools/build.py --config "${{ matrix.config }}" "${compiler_args[@]}" "${precompile_args[@]}" "${suite_args[@]}" \
            --test \
            "--cmake-arg=-DSTRADA_DEPENDENCY_CACHE_DIR=${STRADA_DEPENDENCY_CACHE_DIR}"

      # Diagnostic only: the samples' summaries with their physics state, printed whether the tests passed or not.
      - name: Diagnostic sample hashes
        if: always()
        shell: bash
        run: |
          bin=build/windows-release/bin
          mkdir -p diag/Moto diag/Showcase/Scripts diag/user/Roaming diag/user/Local
          cp -r Projects/Moto/Assets diag/Moto/Assets
          cp Projects/Moto/Moto.sproj diag/Moto/
          cp -r Projects/Showcase/Assets diag/Showcase/Assets
          cp Projects/Showcase/Showcase.sproj diag/Showcase/
          cp -r "$bin/Showcase" diag/Showcase/Scripts/Binaries
          export APPDATA="$PWD/diag/user/Roaming" LOCALAPPDATA="$PWD/diag/user/Local"
          echo "== Moto"
          "$bin/StradaRuntime.exe" --project "$PWD/diag/Moto/Moto.sproj" --scene Scenes/Tests.sscene --test --timeout 90 2>&1 | grep -E "Tests (passed|failed)|Test failed" || true
          echo "== Showcase"
          "$bin/StradaRuntime.exe" --project "$PWD/diag/Showcase/Showcase.sproj" --scene Scenes/Tests.sscene --test 2>&1 | grep -E "Tests (passed|failed)|Test failed" || true
          echo "== C# compiler"
          dotnet --version
