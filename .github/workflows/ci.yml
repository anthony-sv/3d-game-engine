name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  STRADA_DEPENDENCY_CACHE_DIR: ${{ github.workspace }}/.dependency-cache

jobs:
  format:
    name: Format check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install clang-format 22
        run: python -m pip install clang-format==22.1.3
      - name: Check formatting
        run: python Tools/format.py --check

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Windows MSVC Debug", os: windows-2025, config: debug }
          - { name: "Windows MSVC Release", os: windows-2025, config: release }
          - { name: "Linux GCC Debug", os: ubuntu-24.04, config: debug, compiler: gcc }
          - { name: "Linux GCC Release", os: ubuntu-24.04, config: release, compiler: gcc }
          - { name: "Linux Clang Debug", os: ubuntu-24.04, config: debug, compiler: clang }
          - { name: "macOS Apple Clang Debug", os: macos-26, config: debug }
          - { name: "macOS Apple Clang Release", os: macos-26, config: release }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config \
            libwayland-dev libxkbcommon-dev xorg-dev

      - name: Cache dependency archives
        uses: actions/cache@v6
        with:
          path: ${{ env.STRADA_DEPENDENCY_CACHE_DIR }}
          key: dependencies-${{ hashFiles('cmake/StradaDependencies.cmake') }}

      - name: Toolchain versions
        shell: bash
        run: |
          cmake --version
          ninja --version
          if [ "$RUNNER_OS" = "macOS" ]; then xcodebuild -version; fi
          if [ "$RUNNER_OS" = "Linux" ]; then g++ --version; clang++ --version; fi

      - name: Build and test
        shell: bash
        run: |
          compiler_args=()
          if [ -n "${{ matrix.compiler }}" ]; then compiler_args=(--compiler "${{ matrix.compiler }}"); fi
          python Tools/build.py --config "${{ matrix.config }}" "${compiler_args[@]}" --test \
            "--cmake-arg=-DSTRADA_DEPENDENCY_CACHE_DIR=${STRADA_DEPENDENCY_CACHE_DIR}"
