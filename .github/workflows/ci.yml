name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  STRADA_DEPENDENCY_CACHE_DIR: ${{ github.workspace }}/.dependency-cache
  VULKAN_SDK_VERSION: 1.4.363.0
  # Hosted runners may have no display; windowed tests skip there instead of failing.
  STRADA_TESTS_ALLOW_NO_DISPLAY: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  format:
    name: Format check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install clang-format 22
        run: python -m pip install clang-format==22.1.3
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Check formatting
        run: python Tools/format.py --check

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Proof Windows MSVC Debug (1)", os: windows-2025, config: debug, allowNoGpu: "0" }
          - { name: "Proof Windows MSVC Debug (2)", os: windows-2025, config: debug, allowNoGpu: "0" }
          - { name: "Proof Windows MSVC Debug (3)", os: windows-2025, config: debug, allowNoGpu: "0" }
          - { name: "Proof Windows MSVC Debug (4)", os: windows-2025, config: debug, allowNoGpu: "0" }
          - { name: "Proof Windows MSVC Debug (5)", os: windows-2025, config: debug, allowNoGpu: "0" }
          - { name: "Proof Windows MSVC Debug (6)", os: windows-2025, config: debug, allowNoGpu: "0" }
          - { name: "Proof Windows MSVC Debug (7)", os: windows-2025, config: debug, allowNoGpu: "0" }
          - { name: "Proof Windows MSVC Debug (8)", os: windows-2025, config: debug, allowNoGpu: "0" }
          - { name: "Proof Windows MSVC Release, engine tests (1)", os: windows-2025, config: release, allowNoGpu: "0",
              testSuites: "StradaTests;ScriptCoreTests" }
          - { name: "Proof Windows MSVC Release, engine tests (2)", os: windows-2025, config: release, allowNoGpu: "0",
              testSuites: "StradaTests;ScriptCoreTests" }
          - { name: "Proof Windows MSVC Release, engine tests (3)", os: windows-2025, config: release, allowNoGpu: "0",
              testSuites: "StradaTests;ScriptCoreTests" }
          - { name: "Proof Windows MSVC Release, engine tests (4)", os: windows-2025, config: release, allowNoGpu: "0",
              testSuites: "StradaTests;ScriptCoreTests" }
          - { name: "Proof Windows MSVC Release, engine tests (5)", os: windows-2025, config: release, allowNoGpu: "0",
              testSuites: "StradaTests;ScriptCoreTests" }
          - { name: "Proof Windows MSVC Release, engine tests (6)", os: windows-2025, config: release, allowNoGpu: "0",
              testSuites: "StradaTests;ScriptCoreTests" }
          - { name: "Proof Windows MSVC Release, engine tests (7)", os: windows-2025, config: release, allowNoGpu: "0",
              testSuites: "StradaTests;ScriptCoreTests" }
          - { name: "Proof Windows MSVC Release, engine tests (8)", os: windows-2025, config: release, allowNoGpu: "0",
              testSuites: "StradaTests;ScriptCoreTests" }
          - { name: "Proof Windows MSVC Release, editor and player tests (1)", os: windows-2025, config: release,
              allowNoGpu: "0", testSuites: "StradaEditorTests;StradaRuntimeTests;StradaToolTests" }
          - { name: "Proof Windows MSVC Release, editor and player tests (2)", os: windows-2025, config: release,
              allowNoGpu: "0", testSuites: "StradaEditorTests;StradaRuntimeTests;StradaToolTests" }
          - { name: "Proof Windows MSVC Release, editor and player tests (3)", os: windows-2025, config: release,
              allowNoGpu: "0", testSuites: "StradaEditorTests;StradaRuntimeTests;StradaToolTests" }
          - { name: "Proof Windows MSVC Release, editor and player tests (4)", os: windows-2025, config: release,
              allowNoGpu: "0", testSuites: "StradaEditorTests;StradaRuntimeTests;StradaToolTests" }
          - { name: "Proof Windows MSVC Release, editor and player tests (5)", os: windows-2025, config: release,
              allowNoGpu: "0", testSuites: "StradaEditorTests;StradaRuntimeTests;StradaToolTests" }
          - { name: "Proof Windows MSVC Release, editor and player tests (6)", os: windows-2025, config: release,
              allowNoGpu: "0", testSuites: "StradaEditorTests;StradaRuntimeTests;StradaToolTests" }
          - { name: "Proof Windows MSVC Release, editor and player tests (7)", os: windows-2025, config: release,
              allowNoGpu: "0", testSuites: "StradaEditorTests;StradaRuntimeTests;StradaToolTests" }
          - { name: "Proof Windows MSVC Release, editor and player tests (8)", os: windows-2025, config: release,
              allowNoGpu: "0", testSuites: "StradaEditorTests;StradaRuntimeTests;StradaToolTests" }
    env:
      STRADA_TESTS_ALLOW_NO_GPU: ${{ matrix.allowNoGpu }}
    steps:
      - uses: actions/checkout@v7

      # Proof branch only: a job on the old image has nothing to tell and ends here.
      - name: Image guard
        shell: bash
        run: |
          echo "ImageVersion=$ImageVersion ImageOS=$ImageOS"
          case "$ImageVersion" in 20261103*) echo "old image: nothing to learn"; exit 1;; esac

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 -o DPkg::Lock::Timeout=300 update
          sudo apt-get -o Acquire::Retries=3 -o DPkg::Lock::Timeout=300 install -y --no-install-recommends \
            ninja-build pkg-config libwayland-dev libxkbcommon-dev xorg-dev libgtk-3-dev

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1.6.0
        with:
          vulkan_version: ${{ env.VULKAN_SDK_VERSION }}
          cache: true
          install_runtime: ${{ runner.os == 'Windows' }}
          install_lavapipe: ${{ runner.os != 'macOS' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache dependency archives
        uses: actions/cache@v6
        with:
          path: ${{ env.STRADA_DEPENDENCY_CACHE_DIR }}
          key: dependencies-${{ hashFiles('cmake/StradaDependencies.cmake') }}

      - name: Toolchain versions
        shell: bash
        run: |
          cmake --version
          ninja --version
          echo "VULKAN_SDK=${VULKAN_SDK}"
          if [ "$RUNNER_OS" = "macOS" ]; then xcodebuild -version; fi
          if [ "$RUNNER_OS" = "Linux" ]; then g++ --version; clang++ --version; fi
          dotnet --version

      # Building and testing are separate steps: a job killed by its time limit keeps its steps' times but no log, so the
      # step it was in tells which phase ran out of time. The test step runs the same command with --test in place of
      # --keep-going: its configure and build find everything up to date.
      # The build keeps going past a failed compile (--keep-going) and still fails the step: most contributors cannot
      # build two of the three platforms locally, and a run that stopped at the first error would cost one run per error.
      - name: Build
        shell: bash
        run: |
          compiler_args=()
          if [ -n "${{ matrix.compiler }}" ]; then compiler_args=(--compiler "${{ matrix.compiler }}"); fi
          precompile_args=()
          if [ -n "${{ matrix.precompileThirdPartyHeaders }}" ]; then
            precompile_args=("--cmake-arg=-DSTRADA_PRECOMPILE_THIRD_PARTY_HEADERS=${{ matrix.precompileThirdPartyHeaders }}")
          fi
          suite_args=()
          if [ -n "${{ matrix.testSuites }}" ]; then
            suite_args=("--cmake-arg=-DSTRADA_TEST_SUITES=${{ matrix.testSuites }}")
          fi
          python Tools/build.py --config "${{ matrix.config }}" "${compiler_args[@]}" "${precompile_args[@]}" "${suite_args[@]}" \
            --keep-going \
            "--cmake-arg=-DSTRADA_DEPENDENCY_CACHE_DIR=${STRADA_DEPENDENCY_CACHE_DIR}"

      - name: Test
        shell: bash
        run: |
          compiler_args=()
          if [ -n "${{ matrix.compiler }}" ]; then compiler_args=(--compiler "${{ matrix.compiler }}"); fi
          precompile_args=()
          if [ -n "${{ matrix.precompileThirdPartyHeaders }}" ]; then
            precompile_args=("--cmake-arg=-DSTRADA_PRECOMPILE_THIRD_PARTY_HEADERS=${{ matrix.precompileThirdPartyHeaders }}")
          fi
          suite_args=()
          if [ -n "${{ matrix.testSuites }}" ]; then
            suite_args=("--cmake-arg=-DSTRADA_TEST_SUITES=${{ matrix.testSuites }}")
          fi
          python Tools/build.py --config "${{ matrix.config }}" "${compiler_args[@]}" "${precompile_args[@]}" "${suite_args[@]}" \
            --test \
            "--cmake-arg=-DSTRADA_DEPENDENCY_CACHE_DIR=${STRADA_DEPENDENCY_CACHE_DIR}"
