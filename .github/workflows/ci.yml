name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  STRADA_DEPENDENCY_CACHE_DIR: ${{ github.workspace }}/.dependency-cache
  VULKAN_SDK_VERSION: 1.4.363.0
  # Hosted runners may have no display; windowed tests skip there instead of failing.
  STRADA_TESTS_ALLOW_NO_DISPLAY: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  format:
    name: Format check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install clang-format 22
        run: python -m pip install clang-format==22.1.3
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Check formatting
        run: python Tools/format.py --check

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Probe: which part's optimized code (1)", os: windows-2025, config: release, allowNoGpu: "0",
              testSuites: "StradaTests" }
          - { name: "Probe: which part's optimized code (2)", os: windows-2025, config: release, allowNoGpu: "0",
              testSuites: "StradaTests" }
          - { name: "Probe: which part's optimized code (3)", os: windows-2025, config: release, allowNoGpu: "0",
              testSuites: "StradaTests" }
          - { name: "Probe: which part's optimized code (4)", os: windows-2025, config: release, allowNoGpu: "0",
              testSuites: "StradaTests" }
          - { name: "Probe: which part's optimized code (5)", os: windows-2025, config: release, allowNoGpu: "0",
              testSuites: "StradaTests" }
          - { name: "Probe: which part's optimized code (6)", os: windows-2025, config: release, allowNoGpu: "0",
              testSuites: "StradaTests" }
          - { name: "Probe: which part's optimized code (7)", os: windows-2025, config: release, allowNoGpu: "0",
              testSuites: "StradaTests" }
          - { name: "Probe: which part's optimized code (8)", os: windows-2025, config: release, allowNoGpu: "0",
              testSuites: "StradaTests" }
          - { name: "Probe: which part's optimized code (9)", os: windows-2025, config: release, allowNoGpu: "0",
              testSuites: "StradaTests" }
          - { name: "Probe: which part's optimized code (10)", os: windows-2025, config: release, allowNoGpu: "0",
              testSuites: "StradaTests" }
          - { name: "Probe: which part's optimized code (11)", os: windows-2025, config: release, allowNoGpu: "0",
              testSuites: "StradaTests" }
          - { name: "Probe: which part's optimized code (12)", os: windows-2025, config: release, allowNoGpu: "0",
              testSuites: "StradaTests" }
          - { name: "Probe: which part's optimized code (13)", os: windows-2025, config: release, allowNoGpu: "0",
              testSuites: "StradaTests" }
          - { name: "Probe: which part's optimized code (14)", os: windows-2025, config: release, allowNoGpu: "0",
              testSuites: "StradaTests" }
          - { name: "Probe: which part's optimized code (15)", os: windows-2025, config: release, allowNoGpu: "0",
              testSuites: "StradaTests" }
          - { name: "Probe: which part's optimized code (16)", os: windows-2025, config: release, allowNoGpu: "0",
              testSuites: "StradaTests" }
          - { name: "Probe: which part's optimized code (17)", os: windows-2025, config: release, allowNoGpu: "0",
              testSuites: "StradaTests" }
          - { name: "Probe: which part's optimized code (18)", os: windows-2025, config: release, allowNoGpu: "0",
              testSuites: "StradaTests" }
          - { name: "Probe: which part's optimized code (19)", os: windows-2025, config: release, allowNoGpu: "0",
              testSuites: "StradaTests" }
          - { name: "Probe: which part's optimized code (20)", os: windows-2025, config: release, allowNoGpu: "0",
              testSuites: "StradaTests" }
          - { name: "Probe: which part's optimized code (21)", os: windows-2025, config: release, allowNoGpu: "0",
              testSuites: "StradaTests" }
          - { name: "Probe: which part's optimized code (22)", os: windows-2025, config: release, allowNoGpu: "0",
              testSuites: "StradaTests" }
          - { name: "Probe: which part's optimized code (23)", os: windows-2025, config: release, allowNoGpu: "0",
              testSuites: "StradaTests" }
          - { name: "Probe: which part's optimized code (24)", os: windows-2025, config: release, allowNoGpu: "0",
              testSuites: "StradaTests" }
    env:
      STRADA_TESTS_ALLOW_NO_GPU: ${{ matrix.allowNoGpu }}
    steps:
      - uses: actions/checkout@v7

      # Diagnostic only: a job on the old image has nothing to tell and ends here.
      - name: Image guard
        id: image
        shell: bash
        run: |
          echo "ImageVersion=$ImageVersion ImageOS=$ImageOS"
          case "$ImageVersion" in 20261103*) echo "old image: nothing to learn"; exit 1;; esac
          dotnet --list-runtimes || true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 -o DPkg::Lock::Timeout=300 update
          sudo apt-get -o Acquire::Retries=3 -o DPkg::Lock::Timeout=300 install -y --no-install-recommends \
            ninja-build pkg-config libwayland-dev libxkbcommon-dev xorg-dev libgtk-3-dev

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1.6.0
        with:
          vulkan_version: ${{ env.VULKAN_SDK_VERSION }}
          cache: true
          install_runtime: ${{ runner.os == 'Windows' }}
          install_lavapipe: ${{ runner.os != 'macOS' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache dependency archives
        uses: actions/cache@v6
        with:
          path: ${{ env.STRADA_DEPENDENCY_CACHE_DIR }}
          key: dependencies-${{ hashFiles('cmake/StradaDependencies.cmake') }}

      # Diagnostic only: without a global.json the newest installed SDK builds the C# projects.
      - name: Pin the .NET SDK to 10
        if: matrix.pinSdk == '1'
        shell: bash
        run: |
          echo '{ "sdk": { "version": "10.0.100", "rollForward": "latestFeature", "allowPrerelease": false } }' > global.json
          cat global.json
          dotnet --version

      - name: Toolchain versions
        shell: bash
        run: |
          cmake --version
          ninja --version
          echo "VULKAN_SDK=${VULKAN_SDK}"
          if [ "$RUNNER_OS" = "macOS" ]; then xcodebuild -version; fi
          if [ "$RUNNER_OS" = "Linux" ]; then g++ --version; clang++ --version; fi
          dotnet --version

      # Diagnostic only: the nine cases that fail in Release under the new compiler, with optimization as it is and then
      # switched off for one part at a time.
      - name: Probe arms
        shell: bash
        run: |
          set +e
          powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Name"
          filter='-tc=PhysicsScene: a saved state*,PhysicsScene: ball*,PhysicsScene: characters climb*,PhysicsScene: each collider*,Scene: contact handlers read*,Scene: editing a character*,ScenePhysics: a body at rest*,ScenePhysics: a body whose rotation*,ScenePhysics: a moving body*'
          for arm in none jolt strada tests all; do
            echo "::group::build, arm $arm"
            python Tools/build.py --config release --target StradaTests \
              "--cmake-arg=-DSTRADA_TEST_SUITES=StradaTests" "--cmake-arg=-DSTRADA_DIAG_NOOPT=$arm" \
              "--cmake-arg=-DSTRADA_DEPENDENCY_CACHE_DIR=${STRADA_DEPENDENCY_CACHE_DIR}" > build-$arm.log 2>&1
            code=$?
            tail -n 5 build-$arm.log
            echo "::endgroup::"
            echo "== arm $arm: build exit $code"
            build/windows-release/bin/StradaTests.exe "$filter" > run-$arm.log 2>&1
            echo "== arm $arm: run exit $?"
            grep -E "^TEST CASE:|ERROR: |values: |test cases:|assertions:" run-$arm.log | cut -c1-220
          done
          echo "== done"
